# tmux config — symlinked to ~/.config/tmux/tmux.conf by station/install.sh
# Reload inside tmux: prefix + r        (prefix = Ctrl+a)

# ── Prefix ─────────────────────────────────────────────────────────────
# Ctrl+a is easier to reach than the default Ctrl+b.
# Press it twice to send a real Ctrl+a (start of line in the shell).
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Terminal: colours, undercurl, keys, clipboard, images ──────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
# Coloured squiggly underlines for LSP diagnostics
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -s extended-keys on
set -as terminal-features ",xterm-ghostty:extkeys"
set -s set-clipboard on          # yank in tmux/nvim -> macOS clipboard (OSC 52)
set -g allow-passthrough on      # lets image protocols reach Ghostty
set -sg escape-time 10           # no lag when pressing Esc in nvim
set -g focus-events on           # nvim reloads files changed outside it

# ── Basics ─────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -g base-index 1              # windows start at 1 (matches keyboard layout)
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off     # closing a session jumps to another instead of quitting

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── Windows & panes (open in the current folder) ───────────────────────
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Popups ─────────────────────────────────────────────────────────────
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind s choose-tree -Zs           # session switcher

# ── Copy mode with vim keys ────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Seamless Ctrl+hjkl between nvim splits and tmux panes ──────────────
# Pairs with christoomey/vim-tmux-navigator in the nvim config.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# Ctrl+l is "clear screen" in the shell; get it back with prefix + Ctrl+l
bind C-l send-keys C-l

# ── Status bar (Catppuccin Mocha colours) ──────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e] "
set -g status-right "#[fg=#a6adc8]#{?client_prefix,#[fg=#f9e2af]PREFIX ,}%H:%M "
setw -g window-status-format "#[fg=#6c7086] #I #W "
setw -g window-status-current-format "#[fg=#cba6f7,bold] #I #W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
setw -g mode-style "bg=#45475a"
